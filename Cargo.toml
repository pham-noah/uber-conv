[workspace]
resolver = "2"
members = [
    "crates/uberconv-core",
    "crates/uberconv-formats",
    "crates/uberconv-cli",
    "crates/uberconv-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/pham-noah/uber-conv"
homepage = "https://github.com/pham-noah/uber-conv"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# GPUI 0.2.x -> xattr 0.2.3 doesn't compile on Linux with current libc; see vendor/README.md.
[patch.crates-io]
xattr = { path = "vendor/xattr" }
