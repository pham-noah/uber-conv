[package]
name = "uberconv-app"
version.workspace = true
edition.workspace = true

[[bin]]
name = "uberconv-app"
path = "src/main.rs"

[dependencies]
uberconv-core = { path = "../uberconv-core" }
uberconv-formats = { path = "../uberconv-formats" }
# GPUI is pre-1.0 and its API moves. If a newer release breaks the build,
# pin to the version/commit you verified, e.g.:
#   gpui = { git = "https://github.com/zed-industries/zed", rev = "<commit>" }
gpui = "0.2"
async-channel = "2"
# Native file dialogs with a settable start folder, which GPUI 0.2's
# prompt_for_paths does not offer.
rfd = "0.15"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
